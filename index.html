
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love, endlessly.</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at center, #25070d 0%, #0c0508 55%, #030303 100%);
    color: #f8dfe4;
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    text-align: center;
    padding: 28px 12px;
  }
  h1 {
    font-size: clamp(25px, 5vw, 42px);
    font-weight: normal;
    letter-spacing: 3px;
    color: #f3c4cc;
    text-shadow: 0 0 20px #a20e32;
    margin: 0 0 8px;
  }
  .subtitle {
    color: #b99ba2;
    letter-spacing: 2px;
    font-size: 11px;
    text-transform: uppercase;
    margin-bottom: 22px;
  }
  canvas {
    display: block;
    width: min(94vw, 510px);
    height: auto;
    filter: drop-shadow(0 0 15px #6d001c);
  }
  button {
    margin-top: 16px;
    background: transparent;
    border: 1px solid #9e2342;
    color: #f6dce2;
    padding: 13px 22px;
    font: inherit;
    letter-spacing: 1px;
    cursor: pointer;
    transition: .3s;
  }
  button:hover {
    background: #761027;
    box-shadow: 0 0 24px #8b1734;
  }
  #message {
    max-width: 340px;
    line-height: 1.8;
    color: #e8c4cc;
    opacity: 0;
    transform: translateY(8px);
    transition: .8s;
    margin: 20px 16px 0;
  }
  #message.show {
    opacity: 1;
    transform: translateY(0);
  }
  .footer {
    margin-top: 30px;
    font-size: 10px;
    color: #70535b;
    letter-spacing: 3px;
  }
</style>
</head>
<body>
  <h1>Love, endlessly.</h1>
  <div class="subtitle">One heart. A thousand ways to say it.</div>

  <canvas id="heart" width="700" height="600"></canvas>

  <button id="reveal">Discover what's inside ♥</button>
  <p id="message">
    Across every language, every distance, and every version of this world,
    love always finds a way to say the same thing.<br><br>
    <strong>I love you. In every language. In every lifetime.</strong>
  </p>
  <div class="footer">INFINITELY, ALWAYS.</div>

<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

const phrases = [
  "I LOVE YOU", "JE T'AIME", "TE AMO",
  "TI AMO", "ICH LIEBE DICH", "愛してる",
  "사랑해", "Я ТЕБЯ ЛЮБЛЮ", "我爱你",
  "TE QUIERO", "EU TE AMO", "Σ' ΑΓΑΠΩ",
  "ILY", "MON AMOUR", "FOREVER",
  "SENI SEVIYORUM", "LOVE YOU",
  "JE T'AIME", "I LOVE YOU"
];

const points = [];
const W = canvas.width;
const H = canvas.height;
let start = performance.now();

function heart(t) {
  return {
    x: 16 * Math.pow(Math.sin(t), 3),
    y: -(13 * Math.cos(t) - 5 * Math.cos(2*t)
         - 2 * Math.cos(3*t) - Math.cos(4*t))
  };
}

function insideHeart(x, y) {
  const a = x*x + y*y - 1;
  return a*a*a - x*x*y*y*y <= 0;
}

for (let y = -1.35; y <= 1.15; y += 0.035) {
  for (let x = -1.3; x <= 1.3; x += 0.035) {
    if (insideHeart(x, y)) {
      points.push({
        x: W/2 + x * 205,
        y: H/2 + y * 205,
        phrase: phrases[Math.floor(Math.random()*phrases.length)],
        size: 8 + Math.random()*4,
        phase: Math.random()*Math.PI*2
      });
    }
  }
}

function draw(now) {
  ctx.clearRect(0, 0, W, H);
  const time = now / 1000;
  const pulse = 1 + Math.sin(time*1.5)*0.018;
  const progress = Math.min(1, (now-start)/2600);

  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.scale(pulse, pulse);
  ctx.translate(-W/2, -H/2);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  points.forEach((p, i) => {
    if (i / points.length > progress) return;
    const flicker = 0.65 + 0.35 *
      Math.sin(time*2 + p.phase);
    const alpha = 0.45 + flicker*0.55;

    ctx.font = `bold ${p.size}px Georgia`;
    ctx.fillStyle = `rgba(255,${30+Math.round(flicker*25)},${65+Math.round(flicker*35)},${alpha})`;
    ctx.shadowColor = "#d50035";
    ctx.shadowBlur = 5*flicker;
    ctx.fillText(p.phrase, p.x, p.y);
  });

  ctx.restore();
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

document.getElementById("reveal").addEventListener("click", () => {
  document.getElementById("message").classList.add("show");
  document.getElementById("reveal").textContent = "♥ Always and forever ♥";
});
</script>
</body>
</html>
