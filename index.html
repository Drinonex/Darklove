
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I love you ❤️</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(ellipse at 50% 45%,
    #260710 0%, #10050a 52%, #030204 100%);
  color: #f5cbd5;
  font-family: Georgia, serif;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 24px 12px;
}
h1 {
  font-size: clamp(34px, 7vw, 54px);
  font-weight: normal;
  letter-spacing: 3px;
  text-shadow: 0 0 25px #9c173c;
  margin: 0;
}
.subtitle {
  margin: 12px 0 16px;
  font-size: 11px;
  letter-spacing: 2px;
  color: #bc8898;
}
canvas {
  display: block;
  width: min(96vw, 650px);
  height: auto;
}
button {
  background: transparent;
  border: 1px solid #a22a4b;
  color: #f5cbd5;
  padding: 13px 24px;
  font: inherit;
  cursor: pointer;
  margin-top: 8px;
}
button:hover {
  background: #671329;
  box-shadow: 0 0 20px #7b1734;
}
#message {
  max-width: 390px;
  line-height: 1.8;
  opacity: 0;
  max-height: 0;
  overflow: hidden;
  transition: opacity 1s, max-height 1s;
  margin: 0;
}
#message.show {
  opacity: 1;
  max-height: 300px;
  margin: 24px 12px;
}
.footer {
  font-size: 10px;
  letter-spacing: 3px;
  color: #80505f;
  margin-top: 25px;
}
</style>
</head>
<body>

<h1>I love you</h1>
<div class="subtitle">
  UN CŒUR. MILLE FAÇONS DE LE DIRE.
</div>

<canvas id="heart" width="800" height="700"></canvas>

<button id="replay">Revoir l'animation ♥</button>
<button id="reveal">Découvre mon message ♥</button>

<p id="message">
  Peu importe la langue, la distance ou le monde
  dans lequel nous nous trouvons, l'amour trouve
  toujours une manière de dire la même chose.
  <br><br>
  <strong>
    Je t'aime. Dans toutes les langues.
    Dans toutes les vies.
  </strong>
</p>

<div class="footer">À L'INFINI, POUR TOUJOURS.</div>

<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

const phrases = [
 "Je t'aime", "I love you", "Te amo", "Ti amo",
 "Ich liebe dich", "Eu te amo", "Te quiero",
 "Seni seviyorum", "Kocham cię", "Ik hou van jou",
 "Jag älskar dig", "Jeg elsker dig",
 "Jeg elsker deg", "Minä rakastan sinua",
 "Σ' αγαπώ", "Я тебя люблю", "Я тебе кохаю",
 "我爱你", "愛してる", "사랑해"
];

let words = [];
let animationStart = 0;
const duration = 7500;

// Courbe paramétrique du cœur, pointe en bas.
function heart(t) {
  return {
    x: 16 * Math.pow(Math.sin(t), 3),
    y: -(13*Math.cos(t) - 5*Math.cos(2*t)
         - 2*Math.cos(3*t) - Math.cos(4*t))
  };
}

// Calcul des limites du cœur pour chaque ligne.
function boundaries(y) {
  const intersections = [];
  const steps = 2500;
  let previous = heart(0);

  for (let i = 1; i <= steps; i++) {
    const current = heart(i * Math.PI * 2 / steps);
    if ((previous.y <= y && current.y > y) ||
        (previous.y > y && current.y <= y)) {
      const ratio = (y-previous.y) /
        (current.y-previous.y);
      intersections.push(previous.x +
        ratio*(current.x-previous.x));
    }
    previous = current;
  }
  intersections.sort((a,b) => a-b);
  return intersections;
}

function buildHeart() {
  words = [];
  const scale = 17;
  const centerX = W/2;
  const centerY = H/2 + 10;
  const lineHeight = 14;

  // Placement par lignes, de haut en bas.
  for (let py = -210; py <= 230; py += lineHeight) {
    const mathematicalY = py / scale;
    const edges = boundaries(mathematicalY);
    if (edges.length < 2) continue;

    const left = centerX + edges[0]*scale + 5;
    const right = centerX + edges[edges.length-1]*scale - 5;
    let x = left;

    while (x < right) {
      const phrase = phrases[
        Math.floor(Math.random()*phrases.length)
      ];
      const size = 9 + Math.random()*2;
      ctx.font = `${size}px Georgia`;
      const width = ctx.measureText(phrase).width + 7;

      if (x + width > right) break;

      words.push({
        text: phrase,
        x: x + width/2,
        y: centerY + py,
        size,
        delay: Math.random()*550 +
          ((py+210)/440)*duration*0.88,
        offset: 35 + Math.random()*65,
        phase: Math.random()*Math.PI*2,
        brightness: Math.random()
      });
      x += width;
    }
  }
}

function easeOutCubic(t) {
  return 1-Math.pow(1-t,3);
}

function animate(now) {
  ctx.clearRect(0,0,W,H);
  const elapsed = now-animationStart;

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  words.forEach(w => {
    const t = Math.max(0,Math.min(1,
      (elapsed-w.delay)/1100));
    if (t <= 0) return;

    const ease = easeOutCubic(t);
    const y = w.y + (1-ease)*w.offset;
    const shimmer = elapsed > duration
      ? Math.pow(Math.max(0,
          Math.sin(now/500+w.phase)), 14)
      : 0;

    const edgeGlow = w.brightness;
    const alpha = ease*(0.72+0.28*edgeGlow);
    const red = 175+Math.round(75*edgeGlow);
    const green = 18+Math.round(35*edgeGlow);
    const blue = 45+Math.round(40*edgeGlow);

    ctx.font = `${w.size}px Georgia`;
    ctx.fillStyle =
      `rgba(${red},${green},${blue},${alpha})`;
    ctx.shadowColor = "#ff174c";
    ctx.shadowBlur = 2 + shimmer*15;
    ctx.fillText(w.text,w.x,y);
  });

  requestAnimationFrame(animate);
}

function restart() {
  animationStart = performance.now();
  buildHeart();
}

document.getElementById("replay")
  .addEventListener("click",restart);

document.getElementById("reveal")
  .addEventListener("click",() => {
    document.getElementById("message")
      .classList.add("show");
    document.getElementById("reveal")
      .textContent = "♥ Pour toujours et à jamais ♥";
  });

restart();
requestAnimationFrame(animate);
</script>
</body>
</html>
